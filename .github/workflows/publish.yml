name: brew pr-pull

on:
  workflow_run:
    workflows: ['brew test-bot']
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Tested formula PR number'
        required: true
        type: number
      head_sha:
        description: 'Reviewed PR head commit (full SHA)'
        required: true
        type: string

concurrency:
  group: publish-bottles
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.manual.outputs.pr || steps.auto.outputs.pr }}
      head: ${{ steps.manual.outputs.head || steps.auto.outputs.head }}
      run_id: ${{ steps.auto.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Select successful managed release PR
        id: auto
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publication-guard.py --select "$GITHUB_EVENT_PATH"
      - name: Select manually reviewed PR
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pull_request }}
          HEAD: ${{ inputs.head_sha }}
        run: |
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
  publish:
    needs: select
    if: needs.select.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.select.outputs.pr }}
      PR_HEAD: ${{ needs.select.outputs.head }}
      TEST_RUN: ${{ needs.select.outputs.run_id }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          stable: true
      - name: Check reviewed PR and completed tests
        id: reviewed
        run: |
          args=(--pr "$PR_NUMBER" --head "$PR_HEAD")
          if test -n "$TEST_RUN"; then args+=(--run-id "$TEST_RUN"); fi
          python3 scripts/publication-guard.py "${args[@]}"
      - name: Set up bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish tested bottles
        id: bottles
        if: steps.reviewed.outputs.state == 'OPEN'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew pr-pull --tap="$GITHUB_REPOSITORY" --no-upload --retain-bottle-dir "$PR_NUMBER"
      - name: Merge and publish immutable bottles
        if: steps.reviewed.outputs.state == 'OPEN'
        env:
          BOTTLE_DIRECTORY: ${{ steps.bottles.outputs.bottle_path }}
        run: |
          test -d "$BOTTLE_DIRECTORY"
          (cd "$BOTTLE_DIRECTORY" && brew bottle --merge --write ./*.bottle.json)
          brew audit --skip-style yantaolu/tap/codex-switch
          python3 scripts/upload-bottles.py "$BOTTLE_DIRECTORY"
      - name: Verify reviewed formula and public bottles
        run: |
          git fetch origin "$PR_HEAD"
          git show "$PR_HEAD:Formula/codex-switch.rb" > "$RUNNER_TEMP/reviewed-formula.rb"
          brew info --json=v2 yantaolu/tap/codex-switch > "$RUNNER_TEMP/bottle-info.json"
          python3 scripts/verify-bottles.py \
            --reviewed "$RUNNER_TEMP/reviewed-formula.rb" \
            --info "$RUNNER_TEMP/bottle-info.json"
      - name: Push verified formula
        if: steps.reviewed.outputs.state == 'OPEN'
        run: |
          test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')" = "$PR_HEAD"
          git push origin HEAD:main
      - name: Clean up published PR branch
        run: |
          state="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
          if test "$state" = OPEN; then
            gh pr close "$PR_NUMBER"
          fi
          branch="$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')"
          test "$branch" != main
          ref="$(git ls-remote --heads origin "refs/heads/$branch")"
          if test -n "$ref"; then
            git push origin ":refs/heads/$branch"
          fi
